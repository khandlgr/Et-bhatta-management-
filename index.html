<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ईंट भट्ठा Management System</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#222;
}

header{
  background:#8b2f16;
  color:#fff;
  padding:18px 14px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:6px 0 0;
  font-size:14px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0001;
}

h2{
  margin:0 0 14px;
  font-size:19px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:10px;
  font-size:14px;
}

input,select{
  width:100%;
  padding:12px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  background:#fff;
}

button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:12px;
  margin-top:10px;
  font-size:15px;
  color:#fff;
  background:#8b2f16;
}

button.gray{
  background:#555;
}

button.red{
  background:#c62828;
}

button.green{
  background:#16833b;
}

.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.dash{
  background:#fff;
  border-radius:10px;
  padding:14px;
  box-shadow:0 2px 8px #0001;
}

.dash-title{
  font-size:13px;
  color:#666;
}

.dash-number{
  margin-top:6px;
  font-size:22px;
  font-weight:bold;
  color:#8b2f16;
}

.account{
  border:1px solid #ddd;
  border-radius:10px;
  padding:14px;
  margin-top:10px;
  background:#fff;
}

.account-title{
  font-size:18px;
  font-weight:bold;
}

.account-info{
  line-height:1.7;
  margin-top:5px;
  font-size:14px;
}

.entry{
  background:#f8f8f8;
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin-top:9px;
  line-height:1.7;
}

.total{
  margin-top:10px;
  background:#f0e0d9;
  border-radius:8px;
  padding:10px;
  font-weight:bold;
}

.hidden{
  display:none;
}

.empty{
  color:#777;
  text-align:center;
  padding:15px 5px;
}

footer{
  text-align:center;
  color:#777;
  padding:25px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🧱 ईंट भट्ठा Management System</h1>
  <p>Labour और Patla Account</p>
</header>

<div class="container">

<!-- DASHBOARD -->

<div class="dashboard">

  <div class="dash">
    <div class="dash-title">कुल Accounts</div>
    <div class="dash-number" id="accountCount">0</div>
  </div>

  <div class="dash">
    <div class="dash-title">कुल Entries</div>
    <div class="dash-number" id="entryCount">0</div>
  </div>

  <div class="dash">
    <div class="dash-title">कुल Quantity</div>
    <div class="dash-number" id="quantityCount">0</div>
  </div>

  <div class="dash">
    <div class="dash-title">कुल हिसाब</div>
    <div class="dash-number" id="amountCount">₹0</div>
  </div>

</div>


<!-- NEW ACCOUNT -->

<div class="card">

<h2>➕ नया Account</h2>

<label>नाम</label>

<input
  id="name"
  type="text"
  placeholder="Labour का नाम">


<label>Category</label>

<select id="category" onchange="categoryChanged()">

  <option value="">Category चुनें</option>

  <option value="Patla">Patla</option>

  <option value="ईंट उठाने वाली Labour">
    ईंट उठाने वाली Labour
  </option>

  <option value="Nikasi">
    Nikasi
  </option>

  <option value="Jalai">
    Jalai
  </option>

  <option value="Bharai">
    Bharai
  </option>

</select>


<label>Salary / Rate Type</label>

<select id="salaryType">

  <option value="">
    पहले Category चुनें
  </option>

</select>


<label>Rate ₹</label>

<input
  id="accountRate"
  type="number"
  placeholder="Rate डालें">


<button onclick="createAccount()">
  Account बनाएं
</button>

</div>


<!-- ACCOUNTS -->

<div class="card">

<h2>👷 Labour Accounts</h2>

<div id="accounts"></div>

</div>


<!-- ENTRY -->

<div class="card hidden" id="entryBox">

<h2>➕ नई Entry</h2>

<div id="entryAccountInfo"></div>


<!-- PATLA ENTRY -->

<div id="patlaFields" class="hidden">

<label>Date</label>

<input id="patlaDate" type="date">


<label>काम का विवरण</label>

<input
  id="patlaWork"
  type="text"
  placeholder="काम का विवरण">


<label>भट्ठा / Quantity</label>

<input
  id="patlaQuantity"
  type="number"
  placeholder="Quantity">


<label>Rate ₹</label>

<input
  id="patlaRate"
  type="number"
  placeholder="Rate">

</div>


<!-- BRICK LABOUR ENTRY -->

<div id="brickFields" class="hidden">

<label>Date</label>

<input id="brickDate" type="date">


<label>Source / Patla</label>

<select id="sourcePatla">

  <option value="">
    Patla चुनें
  </option>

</select>


<label>Quantity</label>

<input
  id="brickQuantity"
  type="number"
  placeholder="Quantity">


<label>Rate ₹</label>

<input
  id="brickRate"
  type="number"
  placeholder="Rate">

</div>


<!-- OTHER CATEGORY ENTRY -->

<div id="otherFields" class="hidden">

<label>Date</label>

<input id="otherDate" type="date">


<label>Quantity / काम</label>

<input
  id="otherQuantity"
  type="number"
  placeholder="Quantity">


<label>Rate ₹</label>

<input
  id="otherRate"
  type="number"
  placeholder="Rate">

</div>


<button onclick="saveEntry()">
  💾 Entry Save करें
</button>

<button
  class="gray"
  onclick="closeEntry()">

  वापस Accounts पर जाएँ

</button>

</div>

</div>


<footer>
© 2026 ईंट भट्ठा Management System
</footer>


<script>

let accounts =
JSON.parse(localStorage.getItem("etBhattaAccounts")) || [];

let selectedAccountId = null;


/* DATE */

function today(){

  return new Date()
    .toISOString()
    .split("T")[0];

}


/* CATEGORY CHANGE */

function categoryChanged(){

  const category =
    document.getElementById("category").value;

  const salary =
    document.getElementById("salaryType");

  salary.innerHTML =
    '<option value="">Salary Type चुनें</option>';

  if(!category) return;


  const options = [

    "प्रति हजार",

    "प्रति मन"

  ];


  options.forEach(function(type){

    const option =
      document.createElement("option");

    option.value=type;

    option.textContent=type;

    salary.appendChild(option);

  });

}


/* CREATE ACCOUNT */

function createAccount(){

  const name =
    document.getElementById("name").value.trim();

  const category =
    document.getElementById("category").value;

  const salaryType =
    document.getElementById("salaryType").value;

  const rate =
    Number(document.getElementById("accountRate").value);


  if(!name){

    alert("नाम डालें");

    return;

  }


  if(!category){

    alert("Category चुनें");

    return;

  }


  if(!salaryType){

    alert("Salary / Rate Type चुनें");

    return;

  }


  if(!rate){

    alert("Rate डालें");

    return;

  }


  const account={

    id:Date.now(),

    name:name,

    category:category,

    salaryType:salaryType,

    rate:rate,

    entries:[]

  };


  accounts.push(account);

  saveData();

  clearAccountForm();

  render();

  alert("Account बन गया");

}


/* CLEAR FORM */

function clearAccountForm(){

  document.getElementById("name").value="";

  document.getElementById("category").value="";

  document.getElementById("salaryType").innerHTML =
    '<option value="">पहले Category चुनें</option>';

  document.getElementById("accountRate").value="";

}


/* OPEN ACCOUNT */

function openAccount(id){

  selectedAccountId=id;

  const account =
    accounts.find(a=>a.id===id);

  if(!account) return;


  document
    .getElementById("entryBox")
    .classList.remove("hidden");


  document.getElementById("entryAccountInfo")
    .innerHTML=`

      <div class="account">

        <div class="account-title">
          👷 ${account.name}
        </div>

        <div class="account-info">

          Category:
          <b>${account.category}</b>

          <br>

          Salary Type:
          <b>${account.salaryType}</b>

          <br>

          Rate:
          <b>₹${account.rate}</b>

        </div>

      </div>
    `;


  hideAllEntryFields();


  if(account.category==="Patla"){

    document
      .getElementById("patlaFields")
      .classList.remove("hidden");

    document.getElementById("patlaDate").value=today();

    document.getElementById("patlaRate").value=
      account.rate;

  }

  else if(
    account.category==="ईंट उठाने वाली Labour"
  ){

    document
      .getElementById("brickFields")
      .classList.remove("hidden");

    document.getElementById("brickDate").value=today();

    document.getElementById("brickRate").value=
      account.rate;

    loadPatlaList();

  }

  else{

    document
      .getElementById("otherFields")
      .classList.remove("hidden");

    document.getElementById("otherDate").value=today();

    document.getElementById("otherRate").value=
      account.rate;

  }


  document.getElementById("entryBox")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* HIDE ENTRY FIELDS */

function hideAllEntryFields(){

  document
    .getElementById("patlaFields")
    .classList.add("hidden");

  document
    .getElementById("brickFields")
    .classList.add("hidden");

  document
    .getElementById("otherFields")
    .classList.add("hidden");

}


/* PATLA LIST */

function loadPatlaList(){

  const select =
    document.getElementById("sourcePatla");

  select.innerHTML =
    '<option value="">Patla चुनें</option>';


  accounts
    .filter(a=>a.category==="Patla")
    .forEach(function(account){

      const option =
        document.createElement("option");

      option.value=account.id;

      option.textContent=account.name;

      select.appendChild(option);

    });

}


/* SAVE ENTRY */

function saveEntry(){

  const account =
    accounts.find(
      a=>a.id===selectedAccountId
    );

  if(!account) return;


  let date="";
  let work="";
  let quantity=0;
  let rate=0;
  let source="";


  if(account.category==="Patla"){

    date=
      document.getElementById("patlaDate").value;

    work=
      document.getElementById("patlaWork").value.trim();

    quantity=
      Number(
        document.getElementById("patlaQuantity").value
      );

    rate=
      Number(
        document.getElementById("patlaRate").value
      );

  }

  else if(
    account.category==="ईंट उठाने वाली Labour"
  ){

    date=
      document.getElementById("brickDate").value;

    source=
      document.getElementById("sourcePatla").value;

    quantity=
      Number(
        document.getElementById("brickQuantity").value
      );

    rate=
      Number(
        document.getElementById("brickRate").value
      );


    if(!source){

      alert("Source / Patla चुनें");

      return;

    }

  }

  else{

    date=
      document.getElementById("otherDate").value;

    quantity=
      Number(
        document.getElementById("otherQuantity").value
      );

    rate=
      Number(
        document.getElementById("otherRate").value
      );

  }


  if(!date){

    alert("Date चुनें");

    return;

  }


  if(!quantity){

    alert("Quantity डालें");

    return;

  }


  if(!rate){

    alert("Rate डालें");

    return;

  }


  const amount =
    quantity * rate;


  account.entries.push({

    id:Date.now(),

    date:date,

    work:work,

    source:source,

    quantity:quantity,

    rate:rate,

    amount:amount

  });


  saveData();

  clearEntryForm();

  render();

  alert("Entry Save हो गई");

}


/* CLEAR ENTRY */

function clearEntryForm(){

  const ids=[

    "patlaWork",
    "patlaQuantity",
    "brickQuantity",
    "otherQuantity"

  ];


  ids.forEach(function(id){

    const el=document.getElementById(id);

    if(el) el.value="";

  });

}


/* CLOSE ENTRY */

function closeEntry(){

  selectedAccountId=null;

  document
    .getElementById("entryBox")
    .classList.add("hidden");

}


/* DELETE ENTRY */

function deleteEntry(accountId,entryId){

  const account =
    accounts.find(a=>a.id===accountId);

  if(!account) return;


  if(!confirm("यह Entry delete करनी है?"))
    return;


  account.entries =
    account.entries.filter(
      e=>e.id!==entryId
    );


  saveData();

  render();

}


/* DELETE ACCOUNT */

function deleteAccount(id){

  if(!confirm(
    "पूरा Account और उसकी सभी Entries delete करनी हैं?"
  ))
    return;


  accounts =
    accounts.filter(a=>a.id!==id);


  saveData();

  closeEntry();

  render();

}


/* ACCOUNT TOTAL */

function accountTotal(account){

  return account.entries.reduce(
    (sum,e)=>sum+e.amount,
    0
  );

}


/* RENDER ACCOUNTS */

function render(){

  const box =
    document.getElementById("accounts");


  if(accounts.length===0){

    box.innerHTML=
      '<div class="empty">अभी कोई Account नहीं है।</div>';

  }

  else{

    box.innerHTML="";


    accounts.forEach(function(account){

      const total =
        accountTotal(account);


      let entriesHTML="";


      account.entries.forEach(function(e){

        let extra="";


        if(account.category==="Patla"){

          extra=
            `<br>काम:
             ${e.work || "-"}`;

        }


        if(
          account.category===
          "ईंट उठाने वाली Labour"
        ){

          let sourceName="-";

          const sourceAccount =
            accounts.find(
              a=>a.id==e.source
            );

          if(sourceAccount)
            sourceName=sourceAccount.name;


          extra=
            `<br>Source / Patla:
             ${sourceName}`;

        }


        entriesHTML +=`

          <div class="entry">

            📅 ${e.date}

            ${extra}

            <br>

            Quantity:
            <b>${e.quantity}</b>

            <br>

            Rate:
            ₹${e.rate}

            <br>

            <b>
              Total:
              ₹${e.amount.toLocaleString("en-IN")}
            </b>

            <button
              class="red"
              onclick="
              deleteEntry(
                ${account.id},
                ${e.id}
              )">

              🗑️ Entry Delete

            </button>

          </div>

        `;

      });


      box.innerHTML +=`

        <div class="account">

          <div class="account-title">

            👷 ${account.name}

          </div>

          <div class="account-info">

            Category:
            <b>${account.category}</b>

            <br>

            Salary Type:
            <b>${account.salaryType}</b>

            <br>

            Rate:
            <b>₹${account.rate}</b>

            <br>

            Entries:
            <b>${account.entries.length}</b>

          </div>


          <div class="total">

            Account Total:
            ₹${total.toLocaleString("en-IN")}

          </div>


          <button
            class="green"
            onclick="
            openAccount(${account.id})">

            ➕ नई Entry

          </button>


          <button
            class="red"
            onclick="
            deleteAccount(${account.id})">

            🗑️ Account Delete

          </button>


          ${entriesHTML}

        </div>

      `;

    });

  }


  updateDashboard();

}


/* DASHBOARD */

function updateDashboard(){

  let entries=0;
  let quantity=0;
  let amount=0;


  accounts.forEach(function(account){

    account.entries.forEach(function(e){

      entries++;

      quantity += Number(e.quantity);

      amount += Number(e.amount);

    });

  });


  document.getElementById("accountCount")
    .innerText=accounts.length;


  document.getElementById("entryCount")
    .innerText=entries;


  document.getElementById("quantityCount")
    .innerText=
      quantity.toLocaleString("en-IN");


  document.getElementById("amountCount")
    .innerText=
      "₹"+amount.toLocaleString("en-IN");

}


/* SAVE DATA */

function saveData(){

  localStorage.setItem(
    "etBhattaAccounts",
    JSON.stringify(accounts)
  );

}


/* START */

render();

</script>

</body>
</html>
